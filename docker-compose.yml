services:
  text2stl:
    build: .
    ports:
      - "8501:8501"
    environment:
      - LLM_MODE=${LLM_MODE:-mock}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - LLM_API_KEY=${LLM_API_KEY:-dummy}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5-coder:7b}
      - OUTPUT_DIR=/app/outputs
    volumes:
      - ./outputs:/app/outputs

