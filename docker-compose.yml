services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    command: ["sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull ${LLM_MODEL:-qwen3:8b}"]
    volumes:
      - ollama-models:/root/.ollama

  text2stl:
    build: .
    depends_on:
      ollama:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
    ports:
      - "8501:8501"
    environment:
      - LLM_MODE=openai_compatible
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_API_KEY=ollama
      - LLM_MODEL=${LLM_MODEL:-qwen3:8b}
      - OUTPUT_DIR=/app/outputs
    volumes:
      - ./outputs:/app/outputs

volumes:
  ollama-models:
